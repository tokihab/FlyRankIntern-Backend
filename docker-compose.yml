services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_PATH: /app/data/tasks.db
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-llama-3.1-8b-instant}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_KILL_SWITCH: ${LLM_KILL_SWITCH:-false}
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - sqlite_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      BACKEND_URL: http://api:3000
      BACKEND_INTERNAL_URL: http://api:3000
      NEXT_PUBLIC_API_URL: http://localhost:3000
      INNGEST_BASE_URL: http://inngest:8288
      INNGEST_DEV: 1
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-llama-3.1-8b-instant}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_KILL_SWITCH: ${LLM_KILL_SWITCH:-false}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      - api

  inngest:
    image: inngest/inngest:latest
    command: inngest dev -u http://frontend:3002/api/inngest
    ports:
      - "8288:8288"
    depends_on:
      - frontend

volumes:
  sqlite_data: